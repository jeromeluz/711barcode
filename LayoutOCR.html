function parseLayout(text){
 const result={};
 // Count unique shelf numbers; exclude hanging-only racks, shelf layer descriptions and freezer equipment captions.
 const lines=text.replace(/國際精品\s*\(食品\)/g,'國際精品食品').replace(/國際精品\s*\(綜合\)/g,'國際精品綜合').split(/\n/);
 for(const [name,re] of [...aliases,...extraAliases]){
  const ids=new Set();let bare=0;
  for(const line of lines){
   let clean=line.replace(/210\s*[-－]\s*4\s*門冷凍/g,'').replace(/饗喫鍋\s*\d+\s*層/g,'').replace(/零食吊\s*\d+/g,'');
   let m;const rx=new RegExp(re.source,'g');
   while((m=rx.exec(clean))!==null){
    let tail=clean.slice(m.index+m[0].length).match(/^\s*[-－_#：:]?\s*(\d{1,2})(?!\d)/);
    let n=tail?Number(tail[1]):null;
    if(name==='烈酒' && m[0].includes('超值酒藏')){bare=1;continue;}
    if(n&&n<=99)ids.add(n);else if(name==='饗喫鍋'&&/饗喫鍋/.test(clean))bare=1;

   }
  }
  result[name]=name==='烈酒' ? (ids.size + (bare?1:0)) : (ids.size?Math.max(...ids):bare);
 }

}
async function extractPdfText(file){
 status.textContent='正在載入 PDF 文字解析引擎…';
 const mod=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
 mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
 const pdf=await mod.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
 const pages=[];
 for(let i=1;i<=pdf.numPages;i++){
  status.textContent='讀取 PDF 第 '+i+' / '+pdf.numPages+' 頁…';
  const page=await pdf.getPage(i);const content=await page.getTextContent();
  // Separate positioned text fragments, retaining each individual label.
  pages.push(content.items.map(x=>x.str).join('\n'));
 }
 return pages.join('\n');
}

<script>
/* Transfer vertical touch movement from embedded calculator to ST's page.
   Keep normal taps/inputs and sideways scrolling within wide result tables. */
(function(){
 if(window.parent===window || !new URLSearchParams(location.search).has('embed'))return;
 const mobile=()=>window.matchMedia('(max-width: 700px)').matches;
 let lastY=0,lastX=0,mode='',momentumId=0,lastTime=0,velocity=0;
 function stopMomentum(){if(momentumId)cancelAnimationFrame(momentumId);momentumId=0;}
 function send(delta){if(delta)window.parent.postMessage({type:'ST_LAYOUT_SCROLL',delta},location.origin)}
 document.addEventListener('touchstart',e=>{
   if(!mobile()||e.touches.length!==1)return;
   stopMomentum();const t=e.touches[0];lastY=t.clientY;lastX=t.clientX;lastTime=performance.now();velocity=0;mode='';
 },{passive:true});
 document.addEventListener('touchmove',e=>{
   if(!mobile()||e.touches.length!==1)return;
   const t=e.touches[0],dx=t.clientX-lastX,dy=t.clientY-lastY;
   if(!mode && (Math.abs(dx)>3||Math.abs(dy)>3)){
     // Horizontal swipe within tables remains a native horizontal scroll.
     const horizontalTable=e.target.closest('.scroll,.ocrgrid');
     mode=(horizontalTable&&Math.abs(dx)>Math.abs(dy)*1.1)?'horizontal':'vertical';
   }
   if(mode==='vertical'){
     if(e.cancelable)e.preventDefault();
     const now=performance.now(),dt=Math.max(1,now-lastTime);
     velocity=.7*velocity+.3*(-dy/dt);
     send(-dy);
     lastTime=now;
   }
   lastX=t.clientX;lastY=t.clientY;
 },{passive:false});
 document.addEventListener('touchend',()=>{
   if(!mobile()||mode!=='vertical')return;
   let v=velocity*16;
   const tick=()=>{v*=.9;if(Math.abs(v)<.35){momentumId=0;return}send(v);momentumId=requestAnimationFrame(tick)};
   if(Math.abs(v)>1.5)momentumId=requestAnimationFrame(tick);
   mode='';
 },{passive:true});
 document.addEventListener('touchcancel',()=>{mode='';stopMomentum()},{passive:true});
})();
</script>
