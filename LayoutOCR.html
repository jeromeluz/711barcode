function renderPOP(){let totals=new Map();for(const name of names){const n=Math.max(0,Math.min(9999,Math.floor(Number(inputs[name].value)||0)));if(!n)continue;const source=name==='用品'?(n===5?'用品5台版':'用品6台版'):(name==='烈酒'&&n===1?'烈酒單台':(name==='天素地蔬'&&n===2?'天素地蔬兩台':name));const arr=POP[source]||[];for(let i=0;i<(name==='天素地蔬'&&n===2?1:n);i++){for(const item of (arr[Math.min(i,arr.length-1)]||[])){const key=(item.code||'')+'|'+item.name;const old=totals.get(key)||{...item,qty:0,from:new Set()};old.qty+=item.qty;old.from.add(name);totals.set(key,old)}}}for(const item of totals.values()){if(item.code==='637721'){const frozenNeed=Math.max(0,Math.min(9999,Math.floor(Number(inputs['冷凍'].value)||0)));const series=DATA['冷凍'];let pieces=0;for(let i=0;i<frozenNeed;i++)pieces+=series[Math.min(i,series.length-1)].box||0;item.qty=Math.ceil(pieces/2);}}popRows=[...totals.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));const el=document.getElementById('poplist');el.replaceChildren();if(!popRows.length){el.innerHTML='<tr><td colspan="4" class="empty">尚未輸入台數</td></tr>';return}for(const p of popRows){const tr=document.createElement('tr');for(const value of [p.code||'—',p.name,p.qty,[...p.from].join('、')]){const td=document.createElement('td');td.textContent=value;tr.append(td)}el.append(tr)}}
function exportPOP(){const lines=[['品號','品名','數量','來源'],...popRows.map(p=>[p.code,p.name,p.qty,[...p.from].join('、')])];const csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='POP及專用陳列盒需求.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function calc(){const keys=['t','l','r','box','frozenBox','bottom','hook'];let totals=Object.fromEntries(keys.map(k=>[k,0])),counts=0;output=[];const body=document.getElementById('detail');body.replaceChildren();for(const name of names){let n=Math.max(0,Math.floor(Number(inputs[name].value)||0));n=Math.min(n,9999);if(!n)continue;counts+=n;let arr=getSeries(name,n),sum=Object.fromEntries(keys.map(k=>[k,0])),sources=[];for(let i=0;i<(name==='天素地蔬'&&n===2?1:n);i++){let idx=Math.min(i,arr.length-1);keys.forEach(k=>sum[k]+= k==='frozenBox' ? (name==='冷凍' ? (arr[idx].box||0) : 0) : (k==='box' && name==='冷凍' ? 0 : (arr[idx][k]||0)));sources.push(sourceName(name,idx,n))}keys.forEach(k=>totals[k]+=sum[k]);let src=sources.length<=12?sources.join(' + '):sources.slice(0,8).join(' + ')+' … 共 '+n+(name==='冷凍'?' 門':' 台');output.push([name,n,src,...keys.map(k=>sum[k])]);let tr=document.createElement('tr');for(const x of [name,n,...keys.map(k=>sum[k])]){let td=document.createElement('td');td.textContent=x;tr.append(td)}body.append(tr)}keys.forEach(k=>{document.getElementById(k).textContent=totals[k].toLocaleString();document.getElementById('f'+k).textContent=totals[k].toLocaleString()});document.getElementById('count').textContent=counts;renderPOP()}
function resetAll(){names.forEach(n=>inputs[n].value=0);calc()}

function exportCSV(){const keys=['t','l','r','box','frozenBox','bottom','hook'];const totals=keys.map(k=>output.reduce((acc,row)=>acc+(Number(row[3+keys.indexOf(k)])||0),0));const count=output.reduce((acc,row)=>acc+(Number(row[1])||0),0);const lines=[['品類','台數或門數','T型隔板','左隔板','右隔板','一般陳列盒','冷凍陳列盒','糖果陳列架','掛勾'],...output.map(row=>[row[0],row[1],...row.slice(3)]),['合計',count,...totals]];const csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='門市隔板計算明細.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

];

function parseLayout(text, positioned=[]){
 const result=Object.fromEntries(names.map(n=>[n,0]));
 const ids=Object.fromEntries(names.map(n=>[n,new Set()]));
 const bare=new Set();
 // Some CAD exports split vertical labels into separate text fragments.
 // Match shelf numbers, not keyword occurrences; ignore equipment and shelf-layer captions.
 const cleaned=text.replace(/(?:210|225|180)\s*[-+＋]\s*\d+\s*門(?:冷凍)?/g,' ')
   .replace(/(?:冷凍|天素地蔬|饗喫鍋)\s*\d+\s*層/g,' ')
   .replace(/零食吊\s*\d+/g,' ')
   .replace(/天素地蔬\s*\d+\s*台/g,' ')
   .replace(/(?:天素地蔬|饗喫鍋)\s*\d+\s*層/g,' ');
 const rules=[
  ['國際精品食品',/(?:國際精品\s*[(（]?食品[)）]?|國際食品)\s*(\d{1,2})/g],
  ['國際精品綜合',/(?:國際精品\s*[(（]?綜合[)）]?|國際綜合)\s*(\d{1,2})/g],
  ['寵物生活專區',/(?:寵物生活專區|寵物生活|寵物專區)\s*(\d{1,2})/g],
  ['食材調味',/(?:食材調味|食調)\s*(\d{1,2})/g],
  ['健美機能',/(?:健美機能|健美)\s*(\d{1,2})/g],
  ['饗喫鍋',/饗[喫吃]鍋\s*(\d{1,2})(?!\s*層)/g],
  ['麵食',/麵食\s*(\d{1,2})/g],['糖果',/糖果\s*(\d{1,2})/g],
  ['零食',/零食\s*(\d{1,2})(?!\s*吊)/g],['量販',/量販\s*(\d{1,2})/g],
  ['冷凍',/冷凍\s*(\d{1,2})(?!\s*層)/g],['專案',/專案\s*(\d{1,2})/g],
  ['不冰水',/不冰水\s*(\d{1,2})/g],['區域商品',/(?:區域商品|區域)\s*(\d{1,2})/g],
  ['天素地蔬',/天素地蔬\s*(\d{1,2})(?!\s*(?:台|層))/g],
  ['烈酒',/烈酒\s*(\d{1,2})/g],['用品',/用品\s*(\d{1,2})/g]
 ];
 for(const [name,re] of rules){for(const m of cleaned.matchAll(re)){const n=Number(m[1]);if(n>0&&n<=99)ids[name].add(n)}}
 // Match separately drawn vertical 國際精品 and (食品)1 / (綜合)1 by spatial proximity.
 for(const page of positioned){
  const labels=page.filter(x=>/國際精品/.test(x.str));
  for(const x of page){const m=x.str.match(/[（(]\s*(食品|綜合)\s*[）)]\s*(\d{1,2})/);
   if(!m)continue;
   const near=labels.some(y=>Math.abs(x.x-y.x)<45&&Math.abs(x.y-y.y)<55);
   if(near)ids[m[1]==='食品'?'國際精品食品':'國際精品綜合'].add(Number(m[2]));
  }
 }
 // OCR fallback for adjacent labels that were split by line breaks.
 const loose=text.match(/國際精品[\s\S]{0,35}?[（(]\s*(食品|綜合)\s*[）)]\s*(\d{1,2})/g)||[];
 for(const str of loose){const m=str.match(/[（(]\s*(食品|綜合)\s*[）)]\s*(\d{1,2})/);if(m)ids[m[1]==='食品'?'國際精品食品':'國際精品綜合'].add(Number(m[2]))}
 // 「專案」與「時尚文具」為不同貨架，不能互相代入編號。
 // 專案無編號時算一台；時尚文具不計入專案架。
 if(/專案(?:架)?/.test(cleaned)&&!ids['專案'].size)bare.add('專案');
 if(/超值酒藏\s*\d+/.test(text))bare.add('烈酒');
 if(/饗[喫吃]鍋(?!\s*\d+\s*層)/.test(cleaned)&&!ids['饗喫鍋'].size)bare.add('饗喫鍋');
 for(const name of names)result[name]=ids[name].size?Math.max(...ids[name]):0;
 result['烈酒']+=bare.has('烈酒')?1:0;
 if(!result['專案']&&bare.has('專案'))result['專案']=1;
 if(!result['饗喫鍋']&&bare.has('饗喫鍋'))result['饗喫鍋']=1;
 return result;
}
async function extractPdfText(file){
 status.textContent='正在載入 PDF 文字解析引擎…';
 const mod=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
 mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
 const pdf=await mod.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
 const pages=[], positioned=[];
 for(let i=1;i<=pdf.numPages;i++){
  status.textContent='讀取 PDF 第 '+i+' / '+pdf.numPages+' 頁…';
  const page=await pdf.getPage(i),content=await page.getTextContent();
  const items=content.items.filter(x=>x.str&&x.str.trim()).map(x=>({str:x.str.trim(),x:x.transform[4],y:x.transform[5]}));
  positioned.push(items);pages.push(items.map(x=>x.str).join('\n'));
 }
 return {text:pages.join('\n'),positioned};
}
function fillOcr(text, positioned=[]){let counts=parseLayout(text,positioned);let total=Object.values(counts).reduce((a,b)=>a+b,0);names.forEach(name=>inputs[name].value=counts[name]||0);calc();status.textContent='辨識完成，已自動套用 '+total+' 台／門。可在下方修正台數。'}
function loadTesseract(){return new Promise((resolve,reject)=>{if(window.Tesseract)return resolve();let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('無法載入辨識引擎，請確認網路連線'));document.head.append(sc)})}
scan.addEventListener('click',async()=>{if(!selectedFile){status.textContent='請先選擇 Layout 圖片';return}scan.disabled=true;try{status.textContent='正在載入文字辨識引擎…';if(selectedFile.type==='application/pdf'||selectedFile.name.toLowerCase().endsWith('.pdf')){let parsed=await extractPdfText(selectedFile);fillOcr(parsed.text,parsed.positioned);if(!parsed.text.trim())status.textContent='這份 PDF 沒有可讀文字，請改用清晰圖片或手動輸入';return}await loadTesseract();status.textContent='正在辨識圖片文字，可能需要一些時間…';let worker=await Tesseract.createWorker('chi_tra+eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent='辨識中 '+Math.round((m.progress||0)*100)+'%'}});try{let res=await worker.recognize(selectedFile);let t=res.data.text||'';fillOcr(t);if(!t.trim())status.textContent='沒有辨識到文字，建議改用較清晰的圖片'}finally{await worker.terminate()}}catch(err){status.textContent='辨識失敗：'+err.message+'。可以手動輸入下方台數計算。'}finally{scan.disabled=false}});
